#What it does: Central project configuration file for packaging, dependencies, and tooling.
#Logic used: Defines project metadata, dependency info, and tool settings such as test or lint
#configuration.
#Interconnection: Connects the src/ package to the Python environment, test tools, and
#install workflow

[project]
name = "laptop-copilot"
version = "0.1.0"
description = "Lightweight local laptop copilot: whitelisted desktop actions via natural language."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
copilot = "laptop_copilot.ui.cli:app"
ai-stack-desktop = "laptop_copilot.ui.desktop:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laptop_copilot"]

[tool.ruff]
line-length = 100
target-version = "py310"

